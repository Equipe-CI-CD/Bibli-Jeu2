spring.application.name=Bibli-Jeu2

# Adresse de l'API RAWG
rawg.api.url=https://api.rawg.io/api
# La clé n'est JAMAIS écrite ici : elle est lue dans la variable d'environnement RAWG_API_KEY
# (":" = valeur par défaut vide si la variable n'existe pas)
rawg.api.cle=${RAWG_API_KEY:}

# Base H2 enregistrée dans un fichier : ./data/bibliotheque.mv.db
# Les jeux sont donc conservés quand on redémarre l'appli.
spring.datasource.url=jdbc:h2:file:./data/bibliotheque
spring.datasource.username=sa
spring.datasource.password=
# Hibernate crée (ou met à jour) la table JEU tout seul à partir de la classe Jeu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Évite que Tomcat ajoute ";jsessionid=..." dans les adresses lors des redirections
server.servlet.session.tracking-modes=cookie