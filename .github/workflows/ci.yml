name: CI Pipeline - Qualité, Tests & Sécurité

on:
  push:
    branches: [ "CI", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. COMPILATION ET TESTS MAVEN
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java (JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Compilation et Tests unitaires
        run: mvn clean verify

  # 2. SCAN DE SÉCURITÉ DOCKER (Trivy)
  security-scan:
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Build temporaire de l'image Docker pour le Scan
        run: docker build -t app-local:${{ github.sha }} .

      - name: Scan de vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-local:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

# 3. PUBLICATION DE L'IMAGE DOCKER
  docker-build-push:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion au Registry GitHub (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push de l'image Docker
        run: |
          docker build -t ghcr.io/equipe-ci-cd/bibli-jeu2-backend:${{ github.sha }} .
          docker push ghcr.io/equipe-ci-cd/bibli-jeu2-backend:${{ github.sha }}


# 4. MISE A JOUR AUTOMATIQUE DU DEPLOIEMENT
  update-k8s:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Mise a jour de l'image Kubernetes
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E \
            "s|image: ghcr.io/equipe-ci-cd/bibli-jeu2-backend:[^[:space:]]+|image: ghcr.io/equipe-ci-cd/bibli-jeu2-backend:${IMAGE_TAG}|" \
            k8s/deployment.yaml

          grep 'image:' k8s/deployment.yaml

      - name: Commit et push GitOps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "Image deja a jour"
            exit 0
          fi

          git commit -m "chore(gitops): update image to ${{ github.sha }} [skip ci]"
          git push origin HEAD:master